name: OTA Update for Staging

on:
    push:
        branches:
            - hotfix/*

jobs:
    android-update:
        uses: ./.github/workflows/ota-expo.yml
        with:
            platform: android
            app-env: staging
            hostname: ${{ vars.HOSTNAME }}
        secrets: inherit

    ios-update:
        uses: ./.github/workflows/ota-expo.yml
        with:
            platform: ios
            app-env: staging
            hostname: ${{ vars.HOSTNAME }}
        secrets: inherit
