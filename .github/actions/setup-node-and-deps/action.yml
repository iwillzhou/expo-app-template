name: 'Setup Node.js and Dependencies'
description: 'Sets up Node.js, pnpm, and installs project dependencies'

inputs:
    node-version:
        description: 'Node.js version'
        required: false
        default: '24'
    pnpm-version:
        description: 'pnpm version'
        required: false
        default: 'latest'

runs:
    using: 'composite'
    steps:
        - name: Set up Pnpm
          uses: pnpm/action-setup@v4
          with:
              version: ${{ inputs.pnpm-version }}

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
              node-version: ${{ inputs.node-version }}
              cache: 'pnpm'

        - name: Install dependencies
          shell: bash
          run: pnpm i
