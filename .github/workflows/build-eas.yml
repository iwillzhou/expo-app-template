name: Reusable EAS Build Workflow

on:
    workflow_call:
        inputs:
            app-env:
                description: 'Deployment environment (development / testing / staging / production)'
                required: false
                default: 'production'
                type: string
            build-type:
                description: 'BuildType (apk,aab,ipa)'
                required: false
                default: 'apk,ipa'
                type: string
            hostname:
                description: 'An API endpoint for uploading to Vercel blob storage'
                required: true
                type: string
        secrets:
            EXPO_TOKEN:
                description: 'An API access token for Expo'
            EXPO_PUBLIC_SUPABASE_KEY:
                description: 'An API access token for Supabase'
            SENTRY_AUTH_TOKEN:
                description: 'An API access token for Sentry'
            EXPO_PUBLIC_REVENUECAT_API_KEY:
                description: 'An API access token for RevenueCat'
            EXPO_PUBLIC_POSTHOG_API_KEY:
                description: 'An API access token for PostHog'

env:
    APP_ENV: ${{ inputs.app-env }}
    HOSTNAME: ${{ inputs.hostname }}
    EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
    SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    EXPO_PUBLIC_REVENUECAT_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY }}
    EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}

jobs:
    android-apk:
        name: Build Android APK
        runs-on: ubuntu-latest
        if: contains(inputs.build-type, 'apk')

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node.js and dependencies
              uses: ./.github/actions/setup-node-and-deps

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3

            - name: Setup EAS
              uses: expo/expo-github-action@v8
              with:
                  eas-version: latest
                  packager: pnpm
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: Build Android APK
              run: eas build --platform android --profile ${{ inputs.app-env }} --local --output ${{ github.workspace }}/app-release.apk

            - name: Upload APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: android-apk-${{ inputs.app-env }}
                  path: ${{ github.workspace }}/app-release.apk
                  retention-days: 5

    android-aab:
        name: Build Android AAB
        runs-on: ubuntu-latest
        if: contains(inputs.build-type, 'aab')

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node.js and dependencies
              uses: ./.github/actions/setup-node-and-deps

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3

            - name: Setup EAS
              uses: expo/expo-github-action@v8
              with:
                  eas-version: latest
                  packager: pnpm
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: Build Android AAB
              run: eas build --platform android --profile ${{ inputs.app-env }}-aab --local --output ${{ github.workspace }}/app-release.aab

            - name: Upload AAB artifact
              uses: actions/upload-artifact@v4
              with:
                  name: android-aab-${{ inputs.app-env }}
                  path: ${{ github.workspace }}/app-release.aab
                  retention-days: 5

    ios-build:
        name: Build iOS
        runs-on: macos-latest
        if: contains(inputs.build-type, 'ipa')

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node.js and dependencies
              uses: ./.github/actions/setup-node-and-deps

            - name: Setup EAS
              uses: expo/expo-github-action@v8
              with:
                  eas-version: latest
                  packager: pnpm
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: Build iOS app
              run: eas build --platform ios --profile ${{ inputs.app-env }} --local --output ${{ github.workspace }}/app-release.ipa

            - name: Upload iOS artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ios-${{ inputs.app-env }}
                  path: ${{ github.workspace }}/app-release.ipa
                  retention-days: 5
